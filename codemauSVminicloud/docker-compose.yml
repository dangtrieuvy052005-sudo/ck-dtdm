
networks: { cloud-net: { name: cloud-net } }

services:
  web:
    build: ./web
    image: hotensv/web:dev
    container_name: web
    networks: [cloud-net]
    ports: [ "8080:80" ]

  app-server:
    build: ./app
    image: hotensv/app:dev
    container_name: app-server
    networks: [cloud-net]
    ports: [ "8085:8081" ]
    environment:
      OIDC_ISSUER:   "http://keycloak:8080/realms/master"
      OIDC_AUDIENCE: "myapp"

  db:
    image: mariadb:11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: [ "3306:3306" ]
    networks: [cloud-net]

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev"]  # KHÔNG thêm --hostname-strict-https
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"          # start-dev vốn bật HTTP; khai báo rõ cho chắc
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks: [cloud-net]

  minio:
    image: minio/minio
    container_name: minio
    command: ["server","/data","--console-address",":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/data:/data
    ports: [ "9000:9000", "9001:9001" ]
    networks: [cloud-net]

  dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns-server
    ports: [ "1053:53/udp" ]
    volumes:
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks: [cloud-net]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports: [ "9100:9100" ]
    networks: [cloud-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: [ "9090:9090" ]
    volumes: [ "./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    networks: [cloud-net]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports: [ "3000:3000" ]
    networks: [cloud-net]

  proxy:
    image: nginx:stable
    ports: ["80:80"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/empty:/etc/nginx/conf.d:ro   # <- đè trống conf.d
    depends_on:
      - web
      - app-server
      - keycloak
    networks: [cloud-net]
    restart: unless-stopped
