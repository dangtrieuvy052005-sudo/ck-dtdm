# Cấu hình Prometheus cho hệ thống MiniCloud

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "backend_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8081"]

  - job_name: "web"
    metrics_path: /
    static_configs:
      - targets: ["web:80", "web2:80"]
