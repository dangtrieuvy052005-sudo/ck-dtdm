# File docker-compose.yml (ĐÃ SỬA)

networks:
  cloud-net:
    name: cloud-net

services:
  # 1. Web Frontend Server (Đã tách thành 2 service để Cân bằng tải)
  web1:
    build: ./web
    image: dangtrieuvy/web:dev
    container_name: web1 # <-- Service 1
    networks:
      - cloud-net
    # 'ports' đã được XÓA. Chỉ proxy mới được expose port.
    restart: unless-stopped

  web2: # <-- THÊM MỚI service 2
    build: ./web
    image: dangtrieuvy/web:dev
    container_name: web2 # <-- Service 2
    networks:
      - cloud-net
    restart: unless-stopped

  # 2. Application Backend Server
  app:
    build: ./app
    image: dangtrieuvy/app:dev
    container_name: app
    networks:
      - cloud-net
    # 'ports' đã được XÓA. Chỉ proxy mới được expose port.
    environment:
      OIDC_ISSUER: "http://auth:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
    restart: unless-stopped

  # 3. Relational Database Server (Giữ nguyên)
  db:
    image: mariadb:11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: studentdb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - cloud-net
    restart: unless-stopped

  # 4. Authentication & Identity Server (Giữ nguyên)
  auth:
    image: quay.io/keycloak/keycloak:latest
    container_name: auth
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - cloud-net

  # 5. Object Storage Server (Giữ nguyên)
  storage:
    image: minio/minio
    container_name: storage
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cloud-net
    restart: unless-stopped

  # 6. Internal DNS Server (Giữ nguyên - chỉ dùng để test 'dig')
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "1053:53/udp"
    volumes:
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      - cloud-net
    restart: unless-stopped

  # 7. Monitoring (Node Exporter) (Giữ nguyên)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    restart: unless-stopped

  # 8. Monitoring (Prometheus Server) (Giữ nguyên)
  monitor:
    image: prom/prometheus:latest
    container_name: monitor
    ports:
      - "9090:9090"
    volumes:
      # Tệp prometheus.yml sẽ được sửa ở bên dưới
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloud-net
    restart: unless-stopped

  # 9. Logging / Visualization (Grafana) (Giữ nguyên)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - cloud-net
    restart: unless-stopped

  # 10. API Gateway / Reverse Proxy
  proxy:
    image: nginx:stable
    container_name: proxy
    depends_on: # <-- CẬP NHẬT depends_on
      - web1
      - web2
      - app
      - auth
    ports:
      - "80:80"
    volumes:
      # Tệp nginx.conf sẽ được sửa ở bên dưới
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped
