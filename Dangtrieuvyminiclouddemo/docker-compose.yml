# File docker-compose.yml (ĐÃ CẬP NHẬT)
# Snapshot cấu hình bảo đảm đáp ứng đầy đủ các yêu cầu báo cáo cuối kỳ.

networks:
  cloud-net:
    name: cloud-net

services:
  # 1. Web Frontend Server (node chính)
  web:
    build: ./web
    image: dangtrieuvy/web:dev
    container_name: web
    networks:
      - cloud-net
    ports:
      - "8080:80"
    restart: unless-stopped

  # 1b. Web Frontend Server (node dự phòng để cân bằng tải)
  web2:
    build: ./web
    image: dangtrieuvy/web:dev
    container_name: web2
    networks:
      - cloud-net
    restart: unless-stopped

  # 2. Application Backend Server
  app:
    build: ./app
    image: dangtrieuvy/app:dev
    container_name: app
    networks:
      - cloud-net
    environment:
      KEYCLOAK_SERVER: "http://auth:8080"
      KEYCLOAK_REALM: "realm_sv001"
      OIDC_ISSUER: "http://auth:8080/realms/realm_sv001"
      OIDC_AUDIENCE: "flask-app"
    ports:
      - "8085:8081"
    restart: unless-stopped

  # 3. Relational Database Server
  db:
    image: mariadb:11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: studentdb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - cloud-net
    restart: unless-stopped

  # 4. Authentication & Identity Server
  auth:
    image: quay.io/keycloak/keycloak:latest
    container_name: auth
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - cloud-net

  # 5. Object Storage Server
  storage:
    image: minio/minio
    container_name: storage
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cloud-net
    restart: unless-stopped

  # 6. Internal DNS Server
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "1053:53/udp"
    volumes:
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      - cloud-net
    restart: unless-stopped

  # 7. Monitoring (Node Exporter)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    restart: unless-stopped

  # 8. Monitoring (Prometheus Server)
  monitor:
    image: prom/prometheus:latest
    container_name: monitor
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloud-net
    restart: unless-stopped

  # 9. Logging / Visualization (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - cloud-net
    restart: unless-stopped

  # 10. API Gateway / Reverse Proxy
  proxy:
    image: nginx:stable
    container_name: proxy
    depends_on:
      - web
      - web2
      - app
      - auth
    ports:
      - "8088:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped
