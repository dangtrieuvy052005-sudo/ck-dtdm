# 9. API Gateway / Reverse Proxy (Nginx)
# File nginx.conf (ĐÃ SỬA để Cân bằng tải)

events {}

http {

  # --- THÊM MỚI: Định nghĩa nhóm server (upstream) để cân bằng tải ---
  # Đây là phần bạn đã thiếu.
  upstream web_servers {
    # Thuật toán mặc định là Round Robin (luân phiên)
    server web1:80; # Trỏ đến service 'web1'
    server web2:80; # Trỏ đến service 'web2'
  }
  # --- KẾT THÚC THÊM MỚI ---

  server {
    listen 80; # Cổng chính của hệ thống

    # Định tuyến cho Web tĩnh
    # Mọi request đến / sẽ được chuyển đến nhóm 'web_servers'
    location / {
      proxy_pass http://web_servers; # <-- THAY ĐỔI QUAN TRỌNG
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến cho App API (Flask) (Giữ nguyên)
    location /api/ {
      proxy_pass http://app:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến cho API /student/ (Giữ nguyên)
    location /student/ {
      proxy_pass http://app:8081/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến cho Keycloak (Giữ nguyên)
    location /auth/ {
      proxy_pass http://auth:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

